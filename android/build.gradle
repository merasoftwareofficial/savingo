buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        // NDK r27 installed hai, jo 16 KB ke liye zaroori hai
        ndkVersion = "27.1.12297006" 
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    configurations.classpath {
        resolutionStrategy {
            // Gradle 8.10.1 latest standards ko support karta hai
            force("com.android.tools.build:gradle:8.10.1")
        }
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    def notifeeLocalMaven = file("$rootDir/../node_modules/@notifee/react-native/android/libs")
    repositories {
        maven { url notifeeLocalMaven.toURI() }
        google()
        mavenCentral()
    }
}
